name: Build Screen Wake Unslop UI
on:
  push:
    branches: [unslop-ui-build]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build and check APK
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          export ANDROID_HOME="${ANDROID_HOME:-$RUNNER_TEMP/android-sdk}"
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]]; then
            manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            if [[ ! -x "$manager" ]]; then
              mkdir -p "$ANDROID_HOME"
              curl -fsSL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
              unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"
              manager="$RUNNER_TEMP/android-tools/cmdline-tools/bin/sdkmanager"
            fi
            yes | "$manager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
            "$manager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          bash build.sh
          mkdir -p build/export
          cp build/aligned.apk build/export/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build/export/
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging build/aligned.apk | sed -n '1,4p'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: screenwake-build
          path: build/export/
          retention-days: 3
