name: Build Screen Wake PDF APK
on:
  push:
    paths:
      - 'pdf-edition/**'
      - '.github/workflows/build-pdf-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdf-edition
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          yes | "$SDKMANAGER" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle :app:assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk ScreenWake_Simple_AutoFlip_PDF_v2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenWake_Simple_AutoFlip_PDF_v2
          path: pdf-edition/ScreenWake_Simple_AutoFlip_PDF_v2.apk
