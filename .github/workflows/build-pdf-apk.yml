name: Build Screen Wake PDF APK
on:
  push:
    paths:
      - 'pdf-edition/**'
      - '.github/workflows/build-pdf-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdf-edition
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle :app:assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk ScreenWake_Simple_AutoFlip_PDF.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenWake_Simple_AutoFlip_PDF
          path: pdf-edition/ScreenWake_Simple_AutoFlip_PDF.apk
