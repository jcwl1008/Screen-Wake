name: Build Screen Wake PDF APK
on:
  push:
    paths:
      - 'pdf-edition/**'
      - '.github/workflows/build-pdf-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdf-edition
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          yes | "$SDKMANAGER" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle :app:assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk ScreenWake_Simple_AutoFlip_PDF_Unslop_v4.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenWake_Simple_AutoFlip_PDF_Unslop_v4.1
          path: pdf-edition/ScreenWake_Simple_AutoFlip_PDF_Unslop_v4.1.apk
      - name: Publish installable APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create pdf-unslop-v4.1.0 ScreenWake_Simple_AutoFlip_PDF_Unslop_v4.1.apk --repo "$GITHUB_REPOSITORY" --title "Screen Wake PDF · Unslop UI v4.1.0" --notes "繁體中文 PDF 閱讀器：顧客觸碰螢幕暫停自動翻頁，閒置 60 秒後自動恢復；另支援三款翻頁動畫、自動循環、PIN 密碼及全螢幕閱讀。Android 9+。此為 GitHub Actions debug 簽署版本，請先在實機測試。" --latest=false
